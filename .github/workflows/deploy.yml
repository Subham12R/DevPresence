name: Deploy

on:
  push:
    branches: [main]

env:
  IMAGE_NAME: ghcr.io/subham12r/dev-presence-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    defaults:
      run:
        working-directory: dev-presence-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dev-presence-api/.nvmrc
          cache: npm
          cache-dependency-path: dev-presence-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run checks
        run: npm test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./dev-presence-api
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Copy docker-compose.yml to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          source: "dev-presence-api/docker-compose.yml"
          target: "~/dev-presence-api"
          strip_components: 1

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 2222
          script: |
            mkdir -p ~/dev-presence-api
            cd ~/dev-presence-api

            docker compose pull
            docker compose up -d --remove-orphans

            docker ps
            docker compose ps
            
            docker image prune -af
