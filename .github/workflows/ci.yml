name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: dev-presence-api

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: dev-presence-api/.nvmrc
          cache: npm
          cache-dependency-path: dev-presence-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run repository checks
        run: npm test